name: CampusPulse CI & Pre-Push Validation

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-and-build:
    name: Spring Boot (Java 21) Test & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Run Spring Boot automated test suite
        run: ./mvnw test -B

      - name: Build production executable fat JAR
        run: ./mvnw clean package -DskipTests -B

  ai-service-test:
    name: Python AI Microservice (3.11) Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train baseline model artifact
        run: python -m training.train

      - name: Run pytest test suite
        run: pytest tests -v

  docker-build-validation:
    name: Docker & Container Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test-and-build, ai-service-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Spring Boot multi-stage Docker build
        run: docker build --file Dockerfile --tag campuspulse-app:ci .

      - name: Validate Python AI microservice Docker build
        run: docker build --file ai-service/Dockerfile --tag campuspulse-ai:ci ./ai-service

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Validate Render Blueprint specification
        run: python3 -c "import yaml; yaml.safe_load(open('render.yaml'))"
