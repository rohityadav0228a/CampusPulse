spring.application.name=CampusPulse

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campuspulse_db}
spring.datasource.username=${DB_USERNAME:campuspulse_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Admin Authentication
campuspulse.admin.username=${ADMIN_USERNAME:admin}
campuspulse.admin.password=${ADMIN_PASSWORD:}
campuspulse.admin.password-hash=${ADMIN_PASSWORD_HASH:}

# Email Notification Configuration (SMTP)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

campuspulse.mail.from=${MAIL_FROM:noreply@campuspulse.edu}
campuspulse.app.base-url=${APP_BASE_URL:http://localhost:8080}

# Notification Outbox Retry Worker & Exponential Backoff
campuspulse.notifications.retry.enabled=${NOTIFICATION_RETRY_ENABLED:true}
campuspulse.notifications.retry.interval-ms=${NOTIFICATION_RETRY_INTERVAL_MS:60000}
campuspulse.notifications.retry.initial-delay-ms=${NOTIFICATION_RETRY_INITIAL_DELAY_MS:10000}
campuspulse.notifications.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
campuspulse.notifications.retry.initial-backoff-ms=${NOTIFICATION_RETRY_INITIAL_BACKOFF_MS:30000}
campuspulse.notifications.retry.backoff-multiplier=${NOTIFICATION_RETRY_BACKOFF_MULTIPLIER:2.0}
campuspulse.notifications.retry.max-backoff-ms=${NOTIFICATION_RETRY_MAX_BACKOFF_MS:300000}
campuspulse.notifications.retry.stale-threshold-ms=${NOTIFICATION_RETRY_STALE_THRESHOLD_MS:300000}

# AI Classifier Microservice Integration (Python FastAPI)
campuspulse.ai.service-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
campuspulse.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:2000}
campuspulse.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:3000}

# Complaint SLA Targets and Automated Escalation
campuspulse.sla.default-response-hours=${SLA_RESPONSE_HOURS:24}
campuspulse.sla.default-resolution-hours=${SLA_RESOLUTION_HOURS:72}
campuspulse.sla.approaching-deadline-hours=${SLA_APPROACHING_HOURS:6}
campuspulse.sla.timezone=${SLA_TIMEZONE:Asia/Kolkata}
campuspulse.sla.admin-escalation-email=${ADMIN_ESCALATION_EMAIL:admin@campuspulse.edu}
campuspulse.sla.escalation.enabled=${SLA_ESCALATION_ENABLED:true}
campuspulse.sla.escalation.interval-ms=${SLA_ESCALATION_INTERVAL_MS:60000}
campuspulse.sla.escalation.initial-delay-ms=${SLA_ESCALATION_INITIAL_DELAY_MS:15000}

